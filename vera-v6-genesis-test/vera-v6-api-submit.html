<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VERA V6 API検証送信</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.55;color:#18202a}
button,input{font:inherit}button{padding:12px 18px;margin-top:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:12px;border-radius:8px}
#status{font-weight:700}
</style>
</head>
<body>
<h2>VERA V6 API検証送信</h2>
<p>署名済みリクエストJSONを選択し、内容を確認してから1回だけ送信します。秘密鍵やGenesisの再生成は行いません。</p>
<p><b>送信先:</b><br>https://vera-v6-api.onrender.com/v1/verify/transaction</p>
<label>リクエストJSONファイル<br><input id="file" type="file" accept=".json,application/json"></label>
<p id="info">ファイル未選択</p>
<button id="send" disabled>VERA APIへ送信</button>
<p id="status" role="status"></p>
<pre id="result">API応答はここに表示されます。</pre>
<script>
const fileInput=document.getElementById('file');
const sendButton=document.getElementById('send');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const result=document.getElementById('result');
let requestText='';
let parsed=null;
fileInput.addEventListener('change',async()=>{
  sendButton.disabled=true; requestText=''; parsed=null;
  statusEl.textContent=''; result.textContent='API応答はここに表示されます。';
  const f=fileInput.files && fileInput.files[0];
  if(!f){info.textContent='ファイル未選択';return;}
  try{
    requestText=await f.text();
    parsed=JSON.parse(requestText);
    const required=['records','head','payload','signatureHex','walletSignatureHex'];
    const missing=required.filter(k=>!(k in parsed));
    if(missing.length) throw new Error('必須フィールド不足: '+missing.join(', '));
    const deadline=Number(parsed.payload && parsed.payload.deadline);
    const now=Math.floor(Date.now()/1000);
    if(!Number.isFinite(deadline)) throw new Error('payload.deadlineを確認できません');
    const remaining=deadline-now;
    info.textContent='読込OK / records='+parsed.records.length+' / 期限まで '+remaining+' 秒';
    if(remaining<=0) throw new Error('Payload期限切れです。送信しません。');
    sendButton.disabled=false;
  }catch(e){
    info.textContent='読込エラー: '+e.message;
    requestText='';parsed=null;
  }
});
sendButton.addEventListener('click',async()=>{
  if(!requestText||!parsed||sendButton.disabled)return;
  if(!confirm('このJSONをVERA V6 APIへ送信します。nonceが消費される可能性があります。送信しますか？'))return;
  sendButton.disabled=true;
  statusEl.textContent='送信中…';
  result.textContent='';
  try{
    const response=await fetch('https://vera-v6-api.onrender.com/v1/verify/transaction',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:requestText
    });
    const body=await response.text();
    statusEl.textContent='HTTP '+response.status+' '+response.statusText;
    try{result.textContent=JSON.stringify(JSON.parse(body),null,2);}
    catch{result.textContent=body||'(レスポンス本文なし)';}
  }catch(e){
    statusEl.textContent='通信エラー';
    result.textContent=String(e)+'\n\nCORS設定またはRender APIの稼働状態を確認してください。自動再送はしていません。';
  }
});
</script>
</body>
</html>
