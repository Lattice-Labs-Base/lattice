
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VERA V6 API Request Submission</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.55;color:#18202a}
button,input{font:inherit}button{padding:12px 18px;margin-top:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:12px;border-radius:8px}
#status{font-weight:700}

/* VERA English file picker: keep the native input functional but hide its localized caption. */
.vera-file-input-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important}
.vera-file-picker{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:8px 0 14px}
.vera-file-picker-button{appearance:none;border:1px solid #64748b;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:#26364d;color:inherit}
.vera-file-picker-button:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
.vera-file-picker-name{font:inherit;overflow-wrap:anywhere;opacity:.85}

</style>
</head>
<body>
<h2>VERA V6 API Request Submission</h2>
<p>Select a signed request JSON, review its contents, and submit it. This page does not generate private keys or regenerate Genesis.</p>
<p><b>Endpoint:</b><br>https://vera-v6-api.onrender.com/v1/verify/transaction</p>
<label>Signed Request JSON File<br><input id="file" type="file" accept=".json,application/json"></label>
<p id="info">No file selected</p>
<button id="send" disabled>Submit to VERA API</button>
<p id="status" role="status"></p>
<pre id="result">The API response will appear here.</pre>

<script>
const fileInput=document.getElementById('file');
const sendButton=document.getElementById('send');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const result=document.getElementById('result');

let parsed=null;

fileInput.addEventListener('change',async()=>{
  sendButton.disabled=true;
  parsed=null;
  statusEl.textContent='';
  result.textContent='The API response will appear here.';

  const f=fileInput.files && fileInput.files[0];
  if(!f){
    info.textContent='No file selected';
    return;
  }

  try{
    parsed=JSON.parse(await f.text());

    const required=[
      'records',
      'head',
      'payload',
      'signatureHex',
      'walletSignatureHex'
    ];

    const missing=required.filter(k=>!(k in parsed));
    if(missing.length){
      throw new Error('Missing required fields: '+missing.join(', '));
    }

    if(!Array.isArray(parsed.records)||parsed.records.length===0){
      throw new Error('records must not be empty');
    }

    const walletSignatureHex=
      String(parsed.walletSignatureHex).replace(/^0x/i,'');

    if(!/^[0-9a-fA-F]{130}$/.test(walletSignatureHex)){
      throw new Error('Wallet signature must be a 65-byte hexadecimal string');
    }

    const deadline=Number(parsed.payload && parsed.payload.deadline);
    const now=Math.floor(Date.now()/1000);

    if(!Number.isFinite(deadline)){
      throw new Error('Unable to read payload.deadline');
    }

    const remaining=deadline-now;
    info.textContent=
      'Loaded / records='+parsed.records.length+
      ' / wallet signature=65 bytes / time remaining: '+remaining+'  seconds';

    if(remaining<=0){
      throw new Error('Payload has expired. Nothing was submitted.');
    }

    sendButton.disabled=false;

  }catch(e){
    info.textContent='File error: '+e.message;
    parsed=null;
  }
});

sendButton.addEventListener('click',async()=>{
  if(!parsed||sendButton.disabled)return;

  if(!confirm(
    'This JSON will be submitted to the VERA V6 API. '+
    'The nonce may be consumed. Do you want to continue?'
  ))return;

  sendButton.disabled=true;
  statusEl.textContent='Submitting…';
  result.textContent='';

  try{
    const requestBody={
      ...parsed,
      walletSignatureHex:
        String(parsed.walletSignatureHex).replace(/^0x/i,'')
    };

    const response=await fetch(
      'https://vera-v6-api.onrender.com/v1/verify/transaction',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(requestBody)
      }
    );

    const body=await response.text();

    statusEl.textContent=
      'HTTP '+response.status+' '+response.statusText;

    try{
      result.textContent=JSON.stringify(JSON.parse(body),null,2);
    }catch{
      result.textContent=body||'(No response body)';
    }

  }catch(e){
    statusEl.textContent='Network error';
    result.textContent=
      String(e)+
      '\n\nCheck the CORS configuration or Render API status. The request was not automatically retried.';
  }
});
</script>
<script>
/* Local-only custom English labels for native file inputs. File reading remains unchanged. */
(function(){
  function installVeraEnglishFilePickers(){
    document.querySelectorAll('input[type="file"]:not([data-vera-file-picker])').forEach(function(input){
      input.setAttribute('data-vera-file-picker','true');
      input.classList.add('vera-file-input-native');
      input.setAttribute('aria-label','Choose File');
      var picker=document.createElement('div');
      picker.className='vera-file-picker';
      var button=document.createElement('button');
      button.type='button';
      button.className='vera-file-picker-button';
      button.textContent='Choose File';
      var name=document.createElement('span');
      name.className='vera-file-picker-name';
      name.textContent='No file selected';
      button.addEventListener('click',function(){input.click();});
      input.addEventListener('change',function(){
        name.textContent=input.files && input.files.length ? input.files[0].name : 'No file selected';
      });
      picker.appendChild(button);
      picker.appendChild(name);
      input.insertAdjacentElement('afterend',picker);
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',installVeraEnglishFilePickers,{once:true});}
  else{installVeraEnglishFilePickers();}
})();
</script>
</body>
</html>
